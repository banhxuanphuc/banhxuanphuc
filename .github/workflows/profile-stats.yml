name: Profile stats

on:
  schedule:
    - cron: "17 */6 * * *"      # every 6 hours
  workflow_dispatch:             # "Run workflow" button
  push:
    branches: [main]
    paths:
      - scripts/build_stats.py
      - scripts/theme.py
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build stats card
        run: python scripts/build_stats.py -o dist/stats.svg
        env:
          # Optional: add a classic PAT (scope: read:user) as repo secret GH_STATS_TOKEN
          # so the numbers include private contributions. Falls back to GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Publish to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
