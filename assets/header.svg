<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="System.init() - neural link connected - I am Phúc, you can call me noName25">
<title>System.init() // I am Phúc, you can call me noName25</title>
<defs>
  <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#3D8BFF"/></linearGradient>
  <pattern id="crt" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".22"/></pattern>
  <radialGradient id="glow" cx=".5" cy="1" r=".7"><stop offset="0" stop-color="#3D8BFF" stop-opacity=".22"/><stop offset="1" stop-color="#3D8BFF" stop-opacity="0"/></radialGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#3D8BFF"/></linearGradient>
  <clipPath id="panel"><rect x="1" y="1" width="998" height="298" rx="12"/></clipPath>
</defs>
<style>
  .mono{font-family:'Cascadia Mono','Cascadia Code',Consolas,'SFMono-Regular',Menlo,'Courier New',monospace}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @keyframes show{to{opacity:1}}
  @keyframes hide{to{opacity:0}}
  text{white-space:pre}
  .tw{animation:blink 3.5s steps(1) infinite}
  .up1{animation:up .55s cubic-bezier(.5,0,.2,1) 2.6s forwards}
  .up2{animation:up .55s cubic-bezier(.5,0,.2,1) 6.2s forwards}
  @keyframes up{to{transform:translateY(-60px)}}
  .shrink1,.shrink2,.dim{transform-box:fill-box;transform-origin:center}
  .shrink1{animation:shrink1 .55s ease 2.6s forwards}
  @keyframes shrink1{to{transform:scale(.72);opacity:.6}}
  .shrink2{animation:shrink2 .55s ease 6.2s forwards}
  @keyframes shrink2{to{transform:scale(.85);opacity:.6}}
  .dim{animation:dim .55s ease 6.2s forwards}
  @keyframes dim{to{transform:scale(.82);opacity:.7}}
  .type1{clip-path:inset(0 100% 0 0);animation:type .8s steps(15) .3s forwards}
  .type3{clip-path:inset(0 100% 0 0);animation:type 1.70s steps(35) 6.90s forwards}
  @keyframes type{to{clip-path:inset(0 0 0 0)}}
  .spin{opacity:0;animation:show 0s 1.15s forwards, hide 0s 2.35s forwards}
  .spin circle{transform-box:fill-box;transform-origin:center;animation:rot .7s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  .ok1{opacity:0;animation:show .15s 2.35s forwards}
  .neural{opacity:0;animation:rise .45s ease-out 2.7s forwards}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .fill{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:fill 3.0s steps(30) 2.9s forwards}
  @keyframes fill{to{transform:scaleX(1)}}
  .pc{opacity:0}
  .hs{opacity:0;animation:show 0s 2.9s forwards, hide 0s 6.00s forwards}
  .conn{opacity:0;animation:show .2s 6.00s forwards}
  .final{opacity:0;animation:show .2s 6.5s forwards}
  .ok3{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .35s cubic-bezier(.3,1.6,.5,1) 6.6s forwards}
  @keyframes pop{to{transform:scale(1)}}
  .cur{opacity:0;animation:show 0s 8.60s forwards, blink 1s steps(1) 8.60s infinite}
</style>

