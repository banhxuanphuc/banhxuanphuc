<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 64" width="1000" height="64" role="img" aria-label="End of transmission - thanks for visiting">
<defs>
  <linearGradient id="f" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00E5FF" stop-opacity="0"/><stop offset=".25" stop-color="#00E5FF"/><stop offset=".75" stop-color="#3D8BFF"/><stop offset="1" stop-color="#3D8BFF" stop-opacity="0"/></linearGradient>
  <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<style>
  .mono{font-family:'Cascadia Mono','Cascadia Code',Consolas,'SFMono-Regular',Menlo,'Courier New',monospace}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @keyframes show{to{opacity:1}}
  @keyframes hide{to{opacity:0}}
  .wrap{opacity:0;animation:show .8s ease 11.0s forwards}
  .run{animation:run 3.5s linear infinite}
  @keyframes run{from{transform:translateX(-120px)}to{transform:translateX(1000px)}}
</style>
<g class="wrap">
  <rect width="1000" height="1.5" y="18" fill="url(#f)" opacity=".8"/>
  <rect width="120" height="1.5" y="18" fill="url(#spark)" class="run"/>
  <text x="500.0" y="48" text-anchor="middle" font-family="'Cascadia Mono','Cascadia Code',Consolas,'SFMono-Regular',Menlo,'Courier New',monospace" font-size="13" letter-spacing="3" fill="#6B7A90">// END_OF_TRANSMISSION <tspan fill="#00E5FF">·</tspan> THANKS FOR VISITING <tspan fill="#00E5FF">·</tspan> SEE YOU IN 2077<tspan fill="#00E5FF" class="blink">_</tspan></text>
</g>
</svg>
