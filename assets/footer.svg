<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 64" width="1000" height="64" role="img" aria-label="End of transmission - thanks for visiting">
<defs>
  <linearGradient id="f" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00F0FF" stop-opacity="0"/><stop offset=".2" stop-color="#00F0FF"/><stop offset=".55" stop-color="#2D7CFF"/><stop offset=".8" stop-color="#FF9E00"/><stop offset="1" stop-color="#FF9E00" stop-opacity="0"/></linearGradient>
  <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<style>.mono{font-family:'Cascadia Mono',Consolas,'SFMono-Regular',Menlo,'Courier New',monospace}.run{animation:run 3.5s linear infinite}@keyframes run{from{transform:translateX(-120px)}to{transform:translateX(1000px)}}.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}</style>
<rect width="1000" height="2" y="18" fill="url(#f)"/>
<rect width="120" height="2" y="18" fill="url(#spark)" class="run"/>
<text x="500.0" y="48" text-anchor="middle" class="mono" font-size="13" letter-spacing="3" fill="#6B7A90">// END_OF_TRANSMISSION <tspan fill="#00F0FF">·</tspan> THANKS FOR VISITING <tspan fill="#FF9E00">·</tspan> SEE YOU IN 2077<tspan fill="#00F0FF" class="blink">_</tspan></text>
</svg>
