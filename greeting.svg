<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="100%" height="80">
  <defs>
    <!-- Cyberpunk Gradient: Xanh Neon sang Cam Neon -->
    <linearGradient id="cyber-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#FF9E00" />
    </linearGradient>
  </defs>

  <!-- Nền đen tuyền, viền xanh neon -->
  <rect width="100%" height="100%" fill="#000000" rx="8" stroke="#00F0FF" stroke-width="1.5" />
  
  <style>
    .text-container { font-family: 'Fira Code', 'Courier New', Courier, monospace; font-size: 24px; font-weight: bold; fill: #a0aec0; }
    .name { fill: url(#cyber-gradient); }
    .cursor { fill: #00F0FF; animation: blink 0.8s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .type-init { clip-path: polygon(-10px -10px, -10px -10px, -10px 100px, -10px 100px); animation: type-init-anim 7s forwards; }
    @keyframes type-init-anim { 0% { clip-path: polygon(-10px -10px, -10px -10px, -10px 100px, -10px 100px); } 15%, 100% { clip-path: polygon(-10px -10px, 300px -10px, 300px 100px, -10px 100px); } }
    .spinner-visibility { opacity: 0; animation: vis-spinner 7s forwards; }
    @keyframes vis-spinner { 0%, 15% { opacity: 0; } 15.1%, 44.9% { opacity: 1; } 45%, 100% { opacity: 0; } }
    .spinner-spin { transform-origin: 280px 42px; animation: spin 0.8s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .check { opacity: 0; fill: #FF9E00; animation: vis-check 7s forwards; }
    @keyframes vis-check { 0%, 44.9% { opacity: 0; } 45%, 100% { opacity: 1; } }
    .type-rest { clip-path: polygon(-10px -10px, -10px -10px, -10px 100px, -10px 100px); animation: type-rest-anim 7s forwards; }
    @keyframes type-rest-anim { 0%, 50% { clip-path: polygon(-10px -10px, -10px -10px, -10px 100px, -10px 100px); } 85%, 100% { clip-path: polygon(-10px -10px, 900px -10px, 900px 100px, -10px 100px); } }
  </style>

  <text x="20" y="50" class="text-container type-init">> System.init():</text>
  <text x="270" y="50" class="text-container check">✔</text>
  <text x="300" y="50" class="text-container type-rest">I'm Phúc, you can call me [<tspan class="name">noName25</tspan>]<tspan class="cursor">_</tspan></text>

  <g class="spinner-visibility">
    <g class="spinner-spin">
      <circle cx="280" cy="42" r="8" fill="none" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="30" stroke-dashoffset="15" />
    </g>
  </g>
</svg>
