<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" width="480" height="640" role="img" aria-label="Animated ASCII avatar">
<title>ASCII avatar</title>
<defs>
  <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00F0FF"/><stop offset=".55" stop-color="#2D7CFF"/><stop offset="1" stop-color="#FF9E00"/>
  </linearGradient>
  <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="30.2" y1="58.0" x2="449.8" y2="578.0">
    <stop offset="0" stop-color="#00F0FF"/><stop offset=".5" stop-color="#4FA8FF"/><stop offset="1" stop-color="#FF9E00"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#00F0FF" stop-opacity="0"/><stop offset=".5" stop-color="#00F0FF" stop-opacity=".16"/><stop offset="1" stop-color="#00F0FF" stop-opacity="0"/>
  </linearGradient>
  <pattern id="crt" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".35"/></pattern>
  <clipPath id="art"><rect x="20" y="52" width="440" height="532"/></clipPath>
</defs>
<style>
  .mono{font-family:'Cascadia Mono',Consolas,'SFMono-Regular',Menlo,'Courier New',monospace}
  .r{opacity:0;white-space:pre;animation:boot .45s ease-out forwards}
  @keyframes boot{0%{opacity:0;transform:translateX(-14px)}55%{opacity:1;transform:translateX(4px)}100%{opacity:1;transform:translateX(0)}}
  @keyframes gl-a{0%,100%{transform:translateX(0);fill:url(#ink)}91%{transform:translateX(-7px);fill:#FF9E00}93%{transform:translateX(5px);fill:#00F0FF}95%{transform:translateX(-2px);fill:url(#ink)}97%{transform:translateX(0)}}
  @keyframes gl-b{0%,100%{transform:translateX(0);fill:url(#ink)}88%{transform:translateX(6px);fill:#00F0FF}90%{transform:translateX(-4px);fill:#FF9E00}92%{transform:translateX(0);fill:url(#ink)}}
  .beam{animation:beam 1.75s linear 0.35s forwards;opacity:0}
  @keyframes beam{0%{opacity:1;transform:translateY(0)}96%{opacity:1}100%{opacity:0;transform:translateY(528.0px)}}
  .sweep{opacity:0;animation:sweep 5s linear 2.05s infinite}
  @keyframes sweep{0%{opacity:1;transform:translateY(-120px)}100%{opacity:1;transform:translateY(640px)}}
  .bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:bar 1.70s cubic-bezier(.6,.1,.3,1) 0.35s forwards}
  @keyframes bar{to{transform:scaleX(1)}}
  .dec{animation:hide 0s 2.05s forwards}
  .ok{opacity:0;animation:show .3s 2.05s forwards}
  @keyframes hide{to{opacity:0}}
  @keyframes show{to{opacity:1}}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .flick{animation:flick 7s steps(1) 2.05s infinite}
  @keyframes flick{0%,100%{opacity:1}42%{opacity:.82}43%{opacity:1}77%{opacity:.9}78%{opacity:1}}
</style>

